<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20463e"/>
      <stop offset="0.55" stop-color="#16261f"/>
      <stop offset="1" stop-color="#0e1a15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ff3b6b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff3b6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="0.36" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#ff8fb0"/>
      <stop offset="0.5" stop-color="#ff3b6b"/>
      <stop offset="1" stop-color="#c31d47"/>
    </radialGradient>
    <linearGradient id="tile1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe0d0"/><stop offset="1" stop-color="#18b9ac"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#f2b134"/>
    </linearGradient>
  </defs>

  <!-- rounded app background -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#glow)"/>

  <!-- faint grid, like the play field -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M28 8V120 M52 8V120 M76 8V120 M100 8V120 M8 28H120 M8 52H120 M8 76H120 M8 100H120"/>
  </g>

  <!-- neon trail leading in -->
  <g>
    <rect x="22" y="86" width="15" height="15" rx="4.5" fill="url(#tile1)"/>
    <rect x="40" y="90" width="13" height="13" rx="4" fill="url(#tile1)" opacity="0.85"/>
    <rect x="90" y="26" width="14" height="14" rx="4.5" fill="url(#tile2)"/>
    <rect x="104" y="40" width="12" height="12" rx="4" fill="url(#tile2)" opacity="0.85"/>
  </g>

  <!-- captured territory block behind the avatar -->
  <rect x="30" y="34" width="52" height="52" rx="12" fill="#ff3b6b" opacity="0.28"/>

  <!-- glossy avatar (the mascot) -->
  <g>
    <rect x="42" y="40" width="52" height="52" rx="16" fill="#7a1030" opacity="0.45" transform="translate(3,5)"/>
    <rect x="42" y="40" width="52" height="52" rx="16" fill="url(#body)" stroke="#8f102f" stroke-width="2"/>
    <!-- eyes -->
    <circle cx="60" cy="63" r="9" fill="#fff"/>
    <circle cx="80" cy="63" r="9" fill="#fff"/>
    <circle cx="63" cy="65" r="4.6" fill="#241017"/>
    <circle cx="83" cy="65" r="4.6" fill="#241017"/>
    <circle cx="60.5" cy="60.5" r="2" fill="#fff"/>
    <circle cx="80.5" cy="60.5" r="2" fill="#fff"/>
  </g>
</svg>
